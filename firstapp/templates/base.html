<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Магазин Мстителей{% endblock %}</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #eef1f6; color: #1c2333; }
        header { background: #1b2a4a; color: #fff; padding: 14px 20px 0; }
        header h1 { margin: 0 0 10px; font-size: 22px; }
        header h1 span { color: #ff5252; }
        nav a { display: inline-block; padding: 8px 16px; color: #c9d3e8; text-decoration: none;
                border-radius: 6px 6px 0 0; font-weight: bold; }
        nav a.on { background: #eef1f6; color: #1b2a4a; }
        main { padding: 20px; max-width: 900px; }
        h2 { margin-top: 0; }
        .card { background: #fff; border: 1px solid #d5dbe6; border-radius: 8px;
                padding: 14px 16px; margin-bottom: 18px; max-width: 420px; }
        .card label { display: block; font-size: 14px; margin: 8px 0 3px; }
        .card input, .card select { width: 100%; box-sizing: border-box; padding: 6px;
                                    border: 1px solid #b8c1d1; border-radius: 4px; }
        button { margin-top: 12px; background: #c62828; color: #fff; border: 0;
                 padding: 8px 18px; border-radius: 4px; cursor: pointer; }
        table { border-collapse: collapse; background: #fff; width: 100%; }
        th, td { border: 1px solid #d5dbe6; padding: 7px 10px; text-align: left; }
        th { background: #1b2a4a; color: #fff; }
        tr:nth-child(even) td { background: #f6f8fb; }
        td.num { text-align: right; }
        a.edit { color: #1565c0; }
        a.del { color: #c62828; }
        .empty { color: #6b7280; }
    </style>
</head>
<body>
<header>
    <h1>Магазин <span>«Мстители»</span></h1>
    <nav>
        <a href="/" class="{% if request.path == '/' or '/edit/' in request.path and '/tovary/' not in request.path and '/zakazy/' not in request.path %}on{% endif %}">Клиенты</a>
        <a href="/tovary/" class="{% if '/tovary/' in request.path %}on{% endif %}">Товары</a>
        <a href="/zakazy/" class="{% if '/zakazy/' in request.path %}on{% endif %}">Заказы</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
